name: Build Aiwa APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# One build publishes at a time: the release below is deleted and recreated.
concurrency:
  group: build-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Before the build, so that a broken backend or link builder fails fast: the backend's
      # relay / login / sphere logic against a fake ntfy and a fake `claude`, and the YourMine link.
      - name: Backend tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s backend/tests
      - run: gradle :bridge:testDebugUnitTest
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aiwa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # The APK is no longer committed to the repository (47 commits of 11 MB made
      # about 490 MB of history). It is one file of ONE rolling release, tagged
      # android-latest, recreated at each build so that the tag follows the commit
      # that was built and the address never changes:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/<repo>.apk
      - name: Publish the APK to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${GITHUB_REPOSITORY#*/}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest "$APK" \
            --target "$GITHUB_SHA" \
            --title "Debug APK (latest build)" \
            --notes "Debug build of ${GITHUB_SHA}. Signed with the fixed debug key, so it installs over the previous one."
