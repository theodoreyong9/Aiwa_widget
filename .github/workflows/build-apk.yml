name: Build Aiwa APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aiwa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the built APK to the repo root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk aiwa-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f aiwa-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "Update built debug APK [skip ci]"
            git push
          fi
